<!DOCTYPE html>
<html>
<head>
    <title>Styled Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 14px;
            border: 1px solid #ddd;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #e8f4f8;
        }
    </style>
</head>

<body>

    <h2>Cricket Player Statistics</h2>

    <table>
        <thead>
            <tr>
                <th>Player</th>
                <th>Matches</th>
                <th>Runs</th>
                <th>Wickets</th>
                <th>Average</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Virat Kohli</td>
                <td>120</td>
                <td>5800</td>
                <td>4</td>
                <td>58.00</td>
            </tr>

            <tr>
                <td>Rohit Sharma</td>
                <td>110</td>
                <td>5200</td>
                <td>8</td>
                <td>52.00</td>
            </tr>

            <tr>
                <td>KL Rahul</td>
                <td>95</td>
                <td>4100</td>
                <td>3</td>
                <td>47.50</td>
            </tr>

            <tr>
                <td>Shubman Gill</td>
                <td>75</td>
                <td>3600</td>
                <td>2</td>
                <td>54.20</td>
            </tr>

            <tr>
                <td>Hardik Pandya</td>
                <td>80</td>
                <td>2200</td>
                <td>65</td>
                <td>38.60</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
